<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Pinterest-Login – Echter Preis</title>
<style>body{background:#121216;color:#fff;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:40px 16px}code{display:block;background:#1E1E26;border:1px solid #333;border-radius:10px;padding:14px;margin:16px auto;max-width:520px;word-break:break-all;font-size:18px}button{background:#10B981;color:#04261b;border:0;border-radius:10px;padding:12px 20px;font-weight:800;font-size:16px;cursor:pointer}</style></head>
<body><h1>🔔 Echter Preis – Pinterest verbunden</h1><p id="t">Diesen Code kopieren und im Fenster von <b>start_pinterest_login.bat</b> einfügen:</p><code id="c">–</code><button id="b" type="button">Code kopieren</button>
<script>var q=new URLSearchParams(location.search),c=q.get('code');if(c){document.getElementById('c').textContent=c}else{document.getElementById('t').textContent=q.get('error')?'Pinterest meldet: '+q.get('error'):'Kein Code in der Adresse.'}
document.getElementById('b').onclick=function(){try{navigator.clipboard.writeText(c||'');this.textContent='Kopiert ✓'}catch(e){}};</script></body></html>
